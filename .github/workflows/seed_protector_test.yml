name: Seed Protector Test State

on:
  workflow_dispatch:

jobs:
  seed-test-state:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed Testnet protector state
        run: python seed_protector_test.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.TESTNET_TRADING_GIST_ID }}
