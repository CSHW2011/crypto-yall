name: Daily Protector Live

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  live-protector:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily protector live
        run: python daily_protector.py
        env:
          HL_PRIVATE_KEY: ${{ secrets.HL_PRIVATE_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: "true"
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          COORDINATOR_GIST_ID: ${{ secrets.COORDINATOR_GIST_ID }}
          GIST_ID: ${{ secrets.TESTNET_TRADING_GIST_ID }}
          SEGREGATED_CAPITAL: ${{ vars.SEGREGATED_CAPITAL }}
          DAILY_PROTECTOR_LIVE: "true"
